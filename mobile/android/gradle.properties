org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.useJavaModuleSystem=false
# Allow more parallelism now that Kotlin 2.0 is stable
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
# Suppress deprecated API warnings from third-party plugins
android.suppressUnsupportedCompileSdk=34
# Fix for Samsung/OEM devices — ensures consistent R8 behaviour
android.enableR8.fullMode=false
