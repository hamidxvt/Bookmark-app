// All plugin versions and classpaths are declared in settings.gradle
// via the declarative pluginManagement + plugins blocks. The old
// buildscript { classpath ... } lines conflicted with that layout.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
