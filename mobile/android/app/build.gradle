// Declarative plugin block — required by modern Flutter plugins that
// depend on the `flutter { }` extension being registered on the app
// module (geolocator_android >= 4.6 etc.). The versions are declared in
// android/settings.gradle so keep them out of here.
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Legacy local.properties reader — kept for versionCode / versionName.
// The declarative flutter plugin already knows how to find flutter.sdk
// so we no longer need flutterRoot here.
def localProperties = new Properties()
def localPropertiesFile = new File(rootProject.projectDir, 'local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.bookmark.sfa"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.bookmark.sfa"
        minSdk 24
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        ndk {
            // Include all 64-bit and 32-bit ARM variants so no device is left out.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // Keep minify OFF — ProGuard/R8 stripping causes random crashes on
            // Samsung Exynos and other OEM devices with custom JIT behaviour.
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    // Produce per-ABI APKs so each device gets the smallest correct binary.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // The Kotlin Android plugin bundles the correct stdlib for its
    // configured Kotlin version — no need to declare it explicitly, and
    // hard-coding it here diverges when the plugin version is bumped.
}
