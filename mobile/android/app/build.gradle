def localProperties = new Properties()
def localPropertiesFile = new File(rootProject.projectDir, 'local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.bookmark.sfa"
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.bookmark.sfa"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        
        // ──────────────────────────────────────────────────────────
        // UNIVERSAL APK: Support all CPU architectures
        // ──────────────────────────────────────────────────────────
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            
            // ──────────────────────────────────────────────────────────
            // DISABLE MINIFICATION for compatibility with all devices
            // (Required for Samsung Exynos, low-end phones, etc.)
            // ──────────────────────────────────────────────────────────
            minifyEnabled false
            shrinkResources false
            
            // ──────────────────────────────────────────────────────────
            // Lint options to prevent build failures
            // ──────────────────────────────────────────────────────────
            lintOptions {
                checkReleaseBuilds false
                abortOnError false
                disable 'InvalidPackage', 'NewApi', 'GradleCompatible'
            }
        }
    }
    
    // ──────────────────────────────────────────────────────────────
    // Disable problematic Gradle 8 lint tasks
    // ──────────────────────────────────────────────────────────────
    tasks.all { task ->
        if (task.name.contains('LintModel') || task.name.contains('generateLint')) {
            task.enabled = false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
