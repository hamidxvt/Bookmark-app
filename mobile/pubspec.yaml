name: bookmark_sfa
description: Bookmark Field Force Sales Automation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3
  pretty_dio_logger: ^1.4.0

  # Local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.25
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure Storage (JWT)
  flutter_secure_storage: ^9.2.2

  # Maps & Location
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Background Sync
  workmanager: ^0.5.2

  # Camera / Image
  image_picker: ^1.1.2

  # UI Helpers
  cached_network_image: ^3.3.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
