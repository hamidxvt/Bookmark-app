name: bookmark_sfa
description: Bookmark Field Force Sales Automation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management — modern Notifier pattern
  flutter_riverpod: 3.4.3

  # Navigation
  go_router: 18.0.1

  # Network
  dio: 5.11.1
  pretty_dio_logger: 1.4.0

  # UI — Material 3, animations, fonts
  flutter_animate: 4.5.2
  google_fonts: 8.2.1
  shimmer: 4.0.0
  cached_network_image: 4.0.0
  lottie: 3.5.1
  cupertino_icons: 1.0.9

  # Local DB (offline-first)
  sqflite: 2.4.4
  path_provider: 2.1.6
  path: 1.9.0

  # Secure Storage — iOS Keychain / Android KeyStore
  flutter_secure_storage: 11.1.1

  # Maps & Location — Google Maps Flutter (native SDK, no Leaflet/OSM)
  google_maps_flutter: 2.18.0
  url_launcher: 6.3.2
  geolocator: 14.0.3
  permission_handler: 13.0.2

  # Camera / Image
  image_picker: 1.2.3

  # Real-time
  socket_io_client: 3.1.6

  # Connectivity & offline sync
  connectivity_plus: 7.3.1
  shared_preferences: 2.5.5

  # Background GPS service
  flutter_background_service: 5.1.0
  http: ^1.2.0

  # Push Notifications (FCM)
  firebase_core: 4.14.0
  firebase_messaging: 16.6.0

  # Signature + PDF (for sample delivery flow)
  signature: 6.4.0
  pdf: 3.13.0
  syncfusion_flutter_pdfviewer: 27.2.5
  share_plus: 13.3.0

  # Utils
  intl: 0.20.3
  package_info_plus: 10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
