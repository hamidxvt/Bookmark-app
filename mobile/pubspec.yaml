name: bookmark_sfa
description: Bookmark Field Force Sales Automation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management — modern Notifier pattern
  flutter_riverpod: 2.5.1

  # Navigation
  go_router: 13.2.0

  # Network
  dio: 5.4.3
  pretty_dio_logger: 1.3.1

  # UI — Material 3, animations, fonts
  flutter_animate: 4.5.0
  google_fonts: 6.2.1
  shimmer: 3.0.0
  cached_network_image: 3.3.1
  lottie: 3.1.0

  # Local DB (offline-first)
  sqflite: 2.3.3+1
  path_provider: 2.1.2
  path: 1.9.0

  # Secure Storage — iOS Keychain / Android KeyStore
  flutter_secure_storage: 9.0.0

  # Maps & Location
  google_maps_flutter: 2.6.0
  geolocator: 11.0.0
  permission_handler: 11.3.0

  # Camera / Image
  image_picker: 1.0.7

  # Real-time
  socket_io_client: 2.0.3+1

  # Utils
  intl: 0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0
  flutter_launcher_icons: 0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A3A5C"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"
