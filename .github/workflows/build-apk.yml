name: Build & Release APK

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.24 had a broken dev.flutter.flutter-plugin-loader that failed
          # to inject the `flutter { }` extension into plugin subprojects
          # (geolocator_android, etc.), so their compileSdkVersion lookup
          # blew up. 3.29.3 is the first version where the loader works
          # reliably with our modern plugin set.
          flutter-version: '3.29.3'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: ./mobile
        run: flutter pub get
      
      - name: Build APK
        working-directory: ./mobile
        run: flutter build apk --release --no-tree-shake-icons
      
      - name: Get version from pubspec
        id: version
        working-directory: ./mobile
        run: |
          VERSION=$(grep "version:" pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
