name: Build & Release APK

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Cache Flutter packages
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-
      
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      
      - name: Get dependencies
        working-directory: ./mobile
        run: flutter pub get
      
      - name: Build APK
        working-directory: ./mobile
        run: |
          flutter clean
          flutter build apk --release --no-tree-shake-icons
      
      - name: Get version from pubspec
        id: version
        working-directory: ./mobile
        run: |
          VERSION=$(grep "version:" pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Check APK exists
        run: |
          if [ -f mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            echo "✅ APK built successfully!"
            ls -lh mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          else
            echo "❌ APK not found!"
            find mobile/build -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
